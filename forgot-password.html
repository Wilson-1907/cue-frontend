<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Forgot Password - Water Flow Monitoring & Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Google Web Fonts (Same as Acuas Template) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet (Acuas Template Colors & Fonts) -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Minimal Top Navigation Bar -->
    <div class="container-fluid bg-white shadow-sm">
        <div class="container">
            <nav class="navbar navbar-light py-3">
                <a href="index.html" class="navbar-brand p-0">
                    <h1 class="text-primary m-0"><i class="fas fa-hand-holding-water text-primary me-3"></i>Cue</h1>
                </a>
                <a href="index.html" class="btn btn-outline-primary rounded-pill px-4">
                    <i class="fas fa-arrow-left me-2"></i>Back to Home
                </a>
            </nav>
        </div>
    </div>

    <!-- Forgot Password Section Start -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="bg-white rounded shadow-sm p-4 p-md-5">
                    <div class="mb-4">
                        <h4 class="text-primary text-uppercase mb-1">Account Recovery</h4>
                        <h2 class="mb-2">Forgot Password</h2>
                        <p class="text-muted mb-0">Enter your registered email address and we will send you a password reset link.</p>
                    </div>

                    <div id="forgotSuccessAlert" class="alert alert-success d-none" role="alert">
                        If an account exists for that email, reset instructions have been sent.
                    </div>

                    <form id="forgotForm">
                        <div class="mb-4">
                            <label for="forgotEmail" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-primary"></i></span>
                                <input type="email" class="form-control bg-light border-start-0 py-3" id="forgotEmail" placeholder="name@company.com" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 mb-3">Send Reset Link</button>

                        <p class="text-center mb-0">
                            <a href="login.html" class="text-primary fw-bold">
                                <i class="fas fa-arrow-left me-1"></i> Back to Login
                            </a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- Forgot Password Section End -->

    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main copy.js"></script>
    <script src="js/forgot-password.js"></script>
  <script src="js/config.js"></script>
</body>

</html>
